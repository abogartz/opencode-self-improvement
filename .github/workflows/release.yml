name: Release

# semantic-release runs on every push to main: it analyzes Conventional Commits
# since the last v{version} tag, decides the semver bump (fix -> patch,
# feat -> minor, BREAKING CHANGE -> major), updates package.json, pushes the
# tag, creates the GitHub Release with generated notes, and publishes to npm
# via Trusted Publishing (OIDC) — no NPM_TOKEN anywhere. Provenance is
# automatic. Pushes with no releasable commits are a no-op.
#
# Requires the trusted publisher on npmjs.com to point at THIS workflow file
# (owner abogartz / repo opencode-self-improvement / release.yml) with
# "npm publish" allowed.
#
# WHY NOT GITHUB_TOKEN: the Main branch ruleset requires a pull request, and
# GitHub gives the default workflow token no bypass — the version-bump push
# dies with GH013 "Changes must be made through a pull request". Release
# pushes therefore run as a dedicated GitHub App, installed on this repo alone
# and listed in the ruleset's bypass list. App needs repository permissions
# Contents / Issues / Pull requests (read & write) and no webhook. Tests and
# typecheck are NOT re-run here: every commit reaching main passed the ci.yml
# checks on its PR (required status checks, strict up-to-date policy).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false # never abort a half-finished publish

jobs:
  release:
    # Defence in depth: .releaserc.json's branches: ["main"] already stops
    # semantic-release on any other branch. This also keeps a workflow_dispatch
    # from another branch from reaching the OIDC step at all, should that
    # config ever widen or a second publish path appear.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # No `environment:` deliberately: its name enters the OIDC token claims,
    # and the npm trusted publisher is configured for the workflow file alone.
    # Adding one silently breaks the next publish until npm is reconfigured.
    permissions:
      contents: read # checkout only; release writes use the App token below
      id-token: write # npm Trusted Publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # semantic-release needs full history and tags
          persist-credentials: false

      # Bun-native repo (bun.lock, no package-lock.json): the semantic-release
      # plugins are devDependencies, so the release needs an install.
      # Bun is pinned on purpose (Bun behaviour differs between releases, e.g.
      # Bun.write({append:true})); bump it here and in ci.yml together.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # Provides Node + the npm CLI that semantic-release drives. Do NOT set
      # registry-url here: the .npmrc it writes conflicts with semantic-release's
      # OIDC authentication (EINVALIDNPMTOKEN).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # Short-lived (1 h) installation token for the release App — the actor
      # the ruleset bypasses for. Mint it only when semantic-release is ready
      # to push. Secrets: SEMANTIC_RELEASE_APP_PRIVATE_KEY; variable:
      # SEMANTIC_RELEASE_APP_ID.
      - name: Mint release-App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      # Analyze -> bump -> commit -> tag -> npm publish -> GitHub release.
      # The version-bump commit carries [skip ci], so it does not re-trigger this
      # workflow. semantic-release pushes the commit and tag before npm publish;
      # if npm fails, they remain, but no GitHub release is created.
      - run: npx semantic-release
        env:
          # semantic-release uses the App token for Git pushes, the GitHub
          # release, and PR/issue comments. npm publishing stays OIDC.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
