name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Bun is pinned on purpose (bun-version in every job below and in release.yml):
# Bun behaviour differs between releases (e.g. Bun.write({append:true})), and
# local dev may run a different version. Bump all four pins together.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint (biome — errors fail; warnings advisory)
        run: bun run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test

  # Terminal merge gate: boots the pinned real opencode CLI in fully isolated
  # XDG dirs (fresh db + fresh store) against a scripted fake model, and runs
  # the load smoke + BDD integration scenarios. Zero API keys involved.
  # V2 ships on npm as per-platform binaries under @opencode (NOT opencode-ai,
  # which is frozen at 1.x). Keep the pin in lockstep with @opencode/plugin.
  smoke:
    runs-on: ubuntu-latest
    env:
      OPENCODE_VERSION: 2.0.26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install pinned opencode CLI
        run: |
          mkdir -p "$HOME/.local/bin" "$RUNNER_TEMP/oc"
          npm pack "@opencode/cli-linux-x64@$OPENCODE_VERSION" --pack-destination "$RUNNER_TEMP/oc"
          tar -xzf "$RUNNER_TEMP/oc/opencode-cli-linux-x64-$OPENCODE_VERSION.tgz" -C "$RUNNER_TEMP/oc"
          install -m 755 "$RUNNER_TEMP/oc/package/bin/opencode" "$HOME/.local/bin/opencode"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          opencode --version
      - name: Terminal smoke + BDD integration
        run: bun run test:e2e
