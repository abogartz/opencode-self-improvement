name: ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint (biome — errors fail; warnings advisory)
        run: bun run lint

  # opencode runs on Windows too, and the store's filesystem assumptions
  # (rename handover, O_EXCL lock files, dir walks) have Windows-specific
  # failure modes that Ubuntu alone cannot see. Separate job, not a matrix on
  # `test`: a matrix renames the check to `test (ubuntu-latest)`/`test
  # (windows-latest)`, and branch rulesets pin required checks by exact name.
  # `test-windows` is informational — it reports, it cannot gate merges.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test

  # Terminal merge gate: boots the pinned real opencode CLI in fully isolated
  # XDG dirs (fresh db + fresh store) against a scripted fake model, and runs
  # the load smoke + BDD integration scenarios. Zero API keys involved.
  # V2 ships on npm as per-platform binaries under @opencode (NOT opencode-ai,
  # which is frozen at 1.x). Keep the pin in lockstep with @opencode/plugin.
  smoke:
    runs-on: ubuntu-latest
    env:
      OPENCODE_VERSION: 2.0.26
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install pinned opencode CLI
        run: |
          mkdir -p "$HOME/.local/bin" "$RUNNER_TEMP/oc"
          npm pack "@opencode/cli-linux-x64@$OPENCODE_VERSION" --pack-destination "$RUNNER_TEMP/oc"
          tar -xzf "$RUNNER_TEMP/oc/opencode-cli-linux-x64-$OPENCODE_VERSION.tgz" -C "$RUNNER_TEMP/oc"
          install -m 755 "$RUNNER_TEMP/oc/package/bin/opencode" "$HOME/.local/bin/opencode"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          opencode --version
      - name: Terminal smoke + BDD integration
        run: bun run test:e2e
