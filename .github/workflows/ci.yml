name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Bun is pinned on purpose (bun-version in every job below and in release.yml):
# Bun behaviour differs between releases (e.g. Bun.write({append:true})), and
# local dev may run a different version. Keep all CI and release pins in sync.

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # The comment policy compares added lines against the branch under review
      # started from. A PR checkout is shallow and has no origin/main, so the
      # base arrives explicitly; without it the lint refuses to run rather than
      # report green on an empty diff. fetch-depth 0 makes that sha reachable.
      COMMENT_LINT_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Comment policy (no tickets, no review narrative in comments)
        run: bun run lint:comments
      - name: Typecheck
        run: bun run typecheck
      - name: Lint (biome — errors fail; warnings advisory)
        run: bun run lint

  # opencode runs on Windows too, and the store's filesystem assumptions
  # (rename handover, O_EXCL lock files, dir walks) have Windows-specific
  # failure modes that Ubuntu alone cannot see. Separate job, not a matrix on
  # `test`: a matrix renames the check to `test (ubuntu-latest)`/`test
  # (windows-latest)`, and branch rulesets pin required checks by exact name.
  # `test-windows` is informational — it reports, it cannot gate merges.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test

  # Terminal merge gate: boots the pinned real opencode CLI in fully isolated
  # XDG dirs (fresh db + fresh store) against a scripted fake model, and runs
  # the load smoke + BDD integration scenarios. Zero API keys involved.
  # V2 ships on npm as per-platform binaries under @opencode (NOT opencode-ai,
  # which is frozen at 1.x).
  smoke:
    runs-on: ubuntu-latest
    env:
      OPENCODE_VERSION: 2.0.26
    steps: &opencode_smoke_steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install pinned opencode CLI
        run: |
          mkdir -p "$HOME/.local/bin" "$RUNNER_TEMP/oc"
          npm pack "@opencode/cli-linux-x64@$OPENCODE_VERSION" --pack-destination "$RUNNER_TEMP/oc"
          tar -xzf "$RUNNER_TEMP/oc/opencode-cli-linux-x64-$OPENCODE_VERSION.tgz" -C "$RUNNER_TEMP/oc"
          install -m 755 "$RUNNER_TEMP/oc/package/bin/opencode" "$HOME/.local/bin/opencode"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/opencode" --version
      - name: Terminal smoke + BDD integration
        run: bun run test:e2e

  # Keep this separate from the required compatibility check. Update the
  # stable v2 pin by PR so any host failure is reproducible.
  smoke-stable:
    runs-on: ubuntu-latest
    env:
      OPENCODE_VERSION: 2.4.1
    steps: *opencode_smoke_steps

  oh-my-pi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENCODE_VERSION: 2.0.26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun install --cwd integration/oh-my-pi --frozen-lockfile
      - name: Install pinned OpenCode for cross-harness checks
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/.local/bin" "$RUNNER_TEMP/oc"
          npm pack "@opencode/cli-linux-x64@$OPENCODE_VERSION" --pack-destination "$RUNNER_TEMP/oc"
          tar -xzf "$RUNNER_TEMP/oc/opencode-cli-linux-x64-$OPENCODE_VERSION.tgz" -C "$RUNNER_TEMP/oc"
          install -m 755 "$RUNNER_TEMP/oc/package/bin/opencode" "$HOME/.local/bin/opencode"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/opencode" --version
      - name: Install pinned OpenCode on Windows for cross-harness checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cliDir = Join-Path $env:RUNNER_TEMP 'oc'
          New-Item -ItemType Directory -Path $cliDir -Force | Out-Null
          npm pack "@opencode/cli-windows-x64@$env:OPENCODE_VERSION" --pack-destination $cliDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -xzf (Join-Path $cliDir "opencode-cli-windows-x64-$env:OPENCODE_VERSION.tgz") -C $cliDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cliPath = Join-Path $cliDir 'package/bin/opencode.exe'
          "OPENCODE_BIN=$cliPath" >> $env:GITHUB_ENV
          & $cliPath --version
      - name: SDK contracts and packed installation
        run: bun run test:oh-my-pi
