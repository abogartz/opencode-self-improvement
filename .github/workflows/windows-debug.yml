name: windows-debug
on:
  workflow_dispatch:
    inputs:
      files:
        description: "test files to run"
        default: "test/concurrency.test.ts test/lifecycle-evidence.test.ts"
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun test ${{ inputs.files }}
